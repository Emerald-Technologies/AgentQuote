name: bom-processor
description: >
  A BOM processing agent for electronic contract manufacturing. Learns customer assembly BOM formats
  and develops per-customer parser scripts that normalize BOMs into a canonical quoting format.
  Built on Microsoft Foundry, powered by DeepSeek-V4.
metadata:
  tags:
    - Agent Framework
    - BOM Processing
    - Electronic Manufacturing
    - Quoting
    - Supply Chain
    - Azure AI AgentServer
    - Responses Protocol
template:
  name: bom-processor
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: "{{FOUNDRY_PROJECT_ENDPOINT}}"
#    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME_PRO
#      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME_PRO}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME_FLASH
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME_FLASH}}"
resources:
#  - kind: model
#    id: deepseek-v4-pro
#    name: AZURE_AI_MODEL_DEPLOYMENT_NAME_PRO
  - kind: model
    id: deepseek-v4-flash
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME_FLASH
