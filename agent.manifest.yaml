name: coding-assistant
description: >
  A coding assistant agent hosted on Microsoft Foundry, powered by DeepSeek-V4-Pro.
  Helps developers write, review, debug, and understand code across all languages and frameworks.
metadata:
  tags:
    - Agent Framework
    - Coding Assistant
    - Code Review
    - Debugging
    - Azure AI AgentServer
    - Responses Protocol
template:
  name: coding-assistant
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: DeepSeek-V4-Pro
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
