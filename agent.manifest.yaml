name: coding-assistant
description: >
  A coding assistant agent hosted on Microsoft Foundry, powered by DeepSeek-V4-Pro.
  Helps developers write, review, debug, and understand code across all languages and frameworks.
metadata:
  tags:
    - Agent Framework
    - Coding Assistant
    - Code Review
    - Debugging
    - Azure AI AgentServer
    - Responses Protocol
template:
  name: coding-assistant
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      value: "{{FOUNDRY_PROJECT_ENDPOINT}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME_PRO
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME_PRO}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME_FLASH
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME_FLASH}}"
resources:
  - kind: model
    id: deepseek-v4-pro
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME_PRO
  - kind: model
    id: deepseek-v4-flash
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME_FLASH
